<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PdfRead Viewer</title>
    <link rel="stylesheet" href="reader.css">
    <style>
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            text-align: center;
            user-select: none;
        }
        .badge {
            background: #C62828;
            color: white;
            font-weight: bold;
            font-size: 28px;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
        }
        h2 {
            font-size: 22px;
            color: #FAFAFA;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #A1A1AA;
            max-width: 460px;
            line-height: 1.5;
        }
        .hint {
            margin-top: 24px;
            font-size: 12px;
            color: #71717A;
            background: #18181B;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #27272A;
        }
    </style>
</head>
<body>
    <div class="empty-state">
        <div class="badge">PDF</div>
        <h2>PdfRead Desktop Viewer</h2>
        <p>Drop a PDF document, Word (.docx), or Excel (.xlsx) spreadsheet here to view, edit in-place, or convert.</p>
        <div class="hint">Press <strong>Ctrl + O</strong> to open a file or use Windows Explorer right-click</div>
    </div>
    <script src="reader.js"></script>
</body>
</html>
